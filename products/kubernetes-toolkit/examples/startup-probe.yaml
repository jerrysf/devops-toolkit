# startup-probe.yaml — for applications whose cold start exceeds ~30s.
# A startupProbe disables liveness/readiness until the app is alive once,
# preventing CrashLoopBackOff caused by probes firing during boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: example-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.example.com/web:1.4.2
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30   # 30 × 10s = 5 min max startup time
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
