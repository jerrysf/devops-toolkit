# image-pull-secret.yaml — private registry authentication, two patterns.

# Pattern A: pull secret object (create it with kubectl instead —
# `kubectl create secret docker-registry` avoids committing credentials).
# Shown here for structure only; never commit real tokens.
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: example-ns
type: kubernetes.io/dockerconfigjson
data:
  # base64 of {"auths":{"<registry>":{"username":"...","password":"...","auth":"..."}}}
  .dockerconfigjson: PLACEHOLDER_CREATE_WITH_KUBECTL
---
# Pattern B: attach to the namespace's ServiceAccount so every pod
# inherits it — one place to rotate instead of every Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: example-ns
imagePullSecrets:
  - name: regcred
---
# Pattern C: reference in the workload directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: example-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: web
          image: registry.example.com/web:1.4.2
